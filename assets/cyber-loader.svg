<svg width="850" height="70" viewBox="0 0 850 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="loaderBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#041208" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#082313" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#041208" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <style>
    @keyframes circle-keys {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.5); opacity: 0.45; }
    }

    @keyframes dot-keys {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.15); }
    }

    @keyframes outline-keys {
      0% { r: 7px; stroke-width: 3.5px; opacity: 0.95; }
      100% { r: 22px; stroke-width: 0.5px; opacity: 0; }
    }

    @keyframes barWave {
      0%, 100% { height: 6px; y: 32px; }
      50% { height: 26px; y: 22px; }
    }

    .node-c1 { animation: circle-keys 2s ease-in-out infinite 0s; transform-origin: 380px 35px; }
    .node-d1 { animation: dot-keys 2s ease-in-out infinite 0s; transform-origin: 380px 35px; }
    .node-o1 { animation: outline-keys 2s ease-in-out infinite 0s; }

    .node-c2 { animation: circle-keys 2s ease-in-out infinite 0.3s; transform-origin: 405px 35px; }
    .node-d2 { animation: dot-keys 2s ease-in-out infinite 0.3s; transform-origin: 405px 35px; }
    .node-o2 { animation: outline-keys 2s ease-in-out infinite 0.3s; }

    .node-c3 { animation: circle-keys 2s ease-in-out infinite 0.6s; transform-origin: 430px 35px; }
    .node-d3 { animation: dot-keys 2s ease-in-out infinite 0.6s; transform-origin: 430px 35px; }
    .node-o3 { animation: outline-keys 2s ease-in-out infinite 0.6s; }

    .node-c4 { animation: circle-keys 2s ease-in-out infinite 0.9s; transform-origin: 455px 35px; }
    .node-d4 { animation: dot-keys 2s ease-in-out infinite 0.9s; transform-origin: 455px 35px; }
    .node-o4 { animation: outline-keys 2s ease-in-out infinite 0.9s; }

    .node-c5 { animation: circle-keys 2s ease-in-out infinite 1.2s; transform-origin: 480px 35px; }
    .node-d5 { animation: dot-keys 2s ease-in-out infinite 1.2s; transform-origin: 480px 35px; }
    .node-o5 { animation: outline-keys 2s ease-in-out infinite 1.2s; }

    .eq-bar-1 { animation: barWave 1.1s ease-in-out infinite 0.1s; }
    .eq-bar-2 { animation: barWave 1.4s ease-in-out infinite 0.4s; }
    .eq-bar-3 { animation: barWave 0.9s ease-in-out infinite 0.2s; }
    .eq-bar-4 { animation: barWave 1.3s ease-in-out infinite 0.6s; }

    .code-font { font-family: 'SF Mono', 'Fira Code', 'IBM Plex Mono', 'Roboto Mono', Monaco, monospace; }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="846" height="66" rx="10" fill="url(#loaderBg)" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Left Side Equalizer Bars (Emerald) -->
  <g fill="#10b981" opacity="0.9">
    <rect x="35" width="3" rx="1.5" class="eq-bar-1" />
    <rect x="42" width="3" rx="1.5" class="eq-bar-2" />
    <rect x="49" width="3" rx="1.5" class="eq-bar-3" />
    <rect x="56" width="3" rx="1.5" class="eq-bar-4" />
  </g>
  <text x="75" y="39" fill="#a7f3d0" font-size="11" font-weight="600" class="code-font" letter-spacing="1">STOCHASTIC ENGINE: ONLINE</text>

  <!-- Center Pulsating Wave Nodes (Emerald Botanical) -->
  <g>
    <!-- Circle 1 -->
    <circle cx="380" cy="35" class="node-o1" stroke="#10b981" fill="none" />
    <circle cx="380" cy="35" r="8" class="node-c1" stroke="#10b981" stroke-width="2" fill="none" />
    <circle cx="380" cy="35" r="5" class="node-d1" fill="#10b981" />

    <!-- Circle 2 -->
    <circle cx="405" cy="35" class="node-o2" stroke="#34d399" fill="none" />
    <circle cx="405" cy="35" r="8" class="node-c2" stroke="#34d399" stroke-width="2" fill="none" />
    <circle cx="405" cy="35" r="5" class="node-d2" fill="#34d399" />

    <!-- Circle 3 -->
    <circle cx="430" cy="35" class="node-o3" stroke="#059669" fill="none" />
    <circle cx="430" cy="35" r="8" class="node-c3" stroke="#059669" stroke-width="2" fill="none" />
    <circle cx="430" cy="35" r="5" class="node-d3" fill="#059669" />

    <!-- Circle 4 -->
    <circle cx="455" cy="35" class="node-o4" stroke="#4ade80" fill="none" />
    <circle cx="455" cy="35" r="8" class="node-c4" stroke="#4ade80" stroke-width="2" fill="none" />
    <circle cx="455" cy="35" r="5" class="node-d4" fill="#4ade80" />

    <!-- Circle 5 -->
    <circle cx="480" cy="35" class="node-o5" stroke="#a7f3d0" fill="none" />
    <circle cx="480" cy="35" r="8" class="node-c5" stroke="#a7f3d0" stroke-width="2" fill="none" />
    <circle cx="480" cy="35" r="5" class="node-d5" fill="#a7f3d0" />
  </g>

  <!-- Right Side Status & Equalizer -->
  <text x="765" y="39" text-anchor="end" fill="#6ee7b7" font-size="11" font-weight="600" class="code-font" letter-spacing="1">MONTE CARLO ITER: 10,000</text>
  <g fill="#34d399" opacity="0.9">
    <rect x="785" width="3" rx="1.5" class="eq-bar-4" />
    <rect x="792" width="3" rx="1.5" class="eq-bar-2" />
    <rect x="799" width="3" rx="1.5" class="eq-bar-1" />
    <rect x="806" width="3" rx="1.5" class="eq-bar-3" />
  </g>
</svg>
