<svg width="800" height="240" viewBox="0 0 800 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Deep Botanical Forest) -->
    <linearGradient id="deckBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041208" />
      <stop offset="50%" stop-color="#072011" />
      <stop offset="100%" stop-color="#020a05" />
    </linearGradient>

    <!-- Card 1: Robotics & Edge AI -->
    <linearGradient id="cardRoboticsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.98" />
    </linearGradient>

    <!-- Card 2: F1 Monte Carlo & Simulators -->
    <linearGradient id="cardSimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.98" />
    </linearGradient>

    <!-- Card 3: Systems & Mobile -->
    <linearGradient id="cardSystemsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#115e59" stop-opacity="0.98" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="frameBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.35" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Strict Clip Path -->
    <clipPath id="stageClip">
      <rect x="2" y="2" width="796" height="236" rx="12" />
    </clipPath>

    <!-- Card Drop Shadow -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <style>
    @keyframes floatLeftCard {
      0%, 100% { transform: translate(220px, 138px) rotate(-6deg) scale(0.97); }
      50% { transform: translate(216px, 130px) rotate(-8deg) scale(1.0); }
    }

    @keyframes floatCenterCard {
      0%, 100% { transform: translate(400px, 134px) rotate(0deg) scale(1.0); }
      50% { transform: translate(400px, 126px) rotate(0deg) scale(1.04); }
    }

    @keyframes floatRightCard {
      0%, 100% { transform: translate(580px, 138px) rotate(6deg) scale(0.97); }
      50% { transform: translate(584px, 130px) rotate(8deg) scale(1.0); }
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .card-float-left { animation: floatLeftCard 5s ease-in-out infinite; transform-origin: center; }
    .card-float-center { animation: floatCenterCard 5s ease-in-out infinite 0.4s; transform-origin: center; }
    .card-float-right { animation: floatRightCard 5s ease-in-out infinite 0.8s; transform-origin: center; }
    .live-dot { animation: pulseDot 2s ease-in-out infinite; }

    .deck-mono { font-family: 'SF Mono', 'Fira Code', 'IBM Plex Mono', Menlo, Consolas, monospace; }
  </style>

  <!-- Container Box with Clip Path -->
  <g clip-path="url(#stageClip)">
    <rect x="2" y="2" width="796" height="236" rx="12" fill="url(#deckBg)" stroke="url(#frameBorder)" stroke-width="1.2" />
    <circle cx="400" cy="130" r="160" fill="url(#centerGlow)" />

    <!-- Terminal Header Bar -->
    <rect x="2" y="2" width="796" height="40" fill="#030d06" fill-opacity="0.8" />
    <line x1="2" y1="42" x2="798" y2="42" stroke="#064e3b" stroke-width="1" />

    <!-- macOS Style Window Controls -->
    <circle cx="24" cy="22" r="5" fill="#ef4444" />
    <circle cx="40" cy="22" r="5" fill="#f59e0b" />
    <circle cx="56" cy="22" r="5" fill="#10b981" />

    <text x="76" y="26" fill="#a7f3d0" font-size="11.5" font-weight="600" class="deck-mono">justin@portfolio: ~ (projects &amp; systems)</text>
    <circle cx="632" cy="22" r="3.5" fill="#10b981" class="live-dot" />
    <text x="644" y="26" fill="#34d399" font-size="11" font-weight="500" class="deck-mono">Amal Jyothi · CSE '29</text>

    <!-- ─────────────────────────────────────────────────────────────
         CARD 1: Autonomous Robotics (Phoenix X)
         ───────────────────────────────────────────────────────────── -->
    <g class="card-float-left">
      <g transform="translate(-75, -55)" filter="url(#shadowFilter)">
        <rect width="150" height="110" rx="12" fill="url(#cardRoboticsGrad)" stroke="#6ee7b7" stroke-width="1.2" />
        
        <!-- Drone / Vision Icon -->
        <g transform="translate(18, 16)">
          <circle cx="10" cy="10" r="9" stroke="#ecfdf5" stroke-width="1.5" fill="none" opacity="0.9" />
          <circle cx="10" cy="10" r="3.5" fill="#ecfdf5" />
          <line x1="1" y1="10" x2="19" y2="10" stroke="#ecfdf5" stroke-width="1" opacity="0.7" />
          <line x1="10" y1="1" x2="10" y2="19" stroke="#ecfdf5" stroke-width="1" opacity="0.7" />
        </g>

        <text x="44" y="28" fill="#ffffff" font-size="10.5" font-weight="700" class="deck-mono">PHOENIX X</text>
        <text x="18" y="58" fill="#ecfdf5" font-size="9" font-weight="500" class="deck-mono">Thermal CV Detection</text>
        <text x="18" y="73" fill="#ecfdf5" font-size="9" font-weight="500" class="deck-mono">Offline LoRa Mesh</text>
        
        <!-- Pill Badge -->
        <rect x="18" y="85" width="114" height="16" rx="4" fill="#022c22" fill-opacity="0.6" stroke="#34d399" stroke-width="0.8" />
        <text x="24" y="96.5" fill="#34d399" font-size="8" font-weight="600" class="deck-mono">SIH 2026 Shortlist</text>
      </g>
    </g>

    <!-- ─────────────────────────────────────────────────────────────
         CARD 2: F1 Monte Carlo Strategy Simulator (Center Flagship)
         ───────────────────────────────────────────────────────────── -->
    <g class="card-float-center">
      <g transform="translate(-82, -58)" filter="url(#shadowFilter)">
        <rect width="164" height="116" rx="14" fill="url(#cardSimGrad)" stroke="#a7f3d0" stroke-width="1.5" />
        
        <!-- Waveform / Telemetry Icon -->
        <g transform="translate(18, 16)">
          <path d="M 0 12 L 6 8 L 12 14 L 18 4 L 24 10" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        </g>

        <text x="50" y="28" fill="#ffffff" font-size="11" font-weight="800" class="deck-mono">F1 SIMULATOR</text>
        <text x="18" y="58" fill="#ffffff" font-size="9.5" font-weight="600" class="deck-mono">10,000 Monte Carlo Runs</text>
        <text x="18" y="73" fill="#ecfdf5" font-size="9" font-weight="500" class="deck-mono">Tyre Degradation Model</text>
        
        <!-- Pill Badge -->
        <rect x="18" y="87" width="128" height="18" rx="4" fill="#022c22" fill-opacity="0.6" stroke="#ffffff" stroke-width="0.8" />
        <text x="24" y="99" fill="#ffffff" font-size="8" font-weight="600" class="deck-mono">Python · FastF1 · React</text>
      </g>
    </g>

    <!-- ─────────────────────────────────────────────────────────────
         CARD 3: Systems & Mobile
         ───────────────────────────────────────────────────────────── -->
    <g class="card-float-right">
      <g transform="translate(-75, -55)" filter="url(#shadowFilter)">
        <rect width="150" height="110" rx="12" fill="url(#cardSystemsGrad)" stroke="#5eead4" stroke-width="1.2" />
        
        <!-- Terminal / Code Icon -->
        <g transform="translate(18, 16)">
          <rect x="0" y="0" width="18" height="16" rx="3" stroke="#ffffff" stroke-width="1.3" fill="none" opacity="0.9" />
          <path d="M 4 8 L 8 8" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" />
        </g>

        <text x="44" y="28" fill="#ffffff" font-size="10.5" font-weight="700" class="deck-mono">SYSTEMS</text>
        <text x="18" y="58" fill="#ecfdf5" font-size="9" font-weight="500" class="deck-mono">AroggyaGram-3 Network</text>
        <text x="18" y="73" fill="#ecfdf5" font-size="9" font-weight="500" class="deck-mono">AutoMeter Dynamic UPI</text>
        
        <!-- Pill Badge -->
        <rect x="18" y="85" width="114" height="16" rx="4" fill="#042f2e" fill-opacity="0.6" stroke="#2dd4bf" stroke-width="0.8" />
        <text x="24" y="96.5" fill="#2dd4bf" font-size="8" font-weight="600" class="deck-mono">ACM Vibefest Winner</text>
      </g>
    </g>

  </g>
</svg>
